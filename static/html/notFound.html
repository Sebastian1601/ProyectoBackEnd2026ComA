<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/notFound.css">
  <title>404 — Página no encontrada</title>
</head>

<body>

  <div class="not-found">
    <div class="scene">
      <!-- caja de reparto vacía sobre ruedas de camión, ilustración simple -->
      <svg viewBox="0 0 220 160" width="100%" height="100%">
        <!-- suelo / sombra -->
        <ellipse cx="110" cy="140" rx="90" ry="10" fill="#E9DCC3" />

        <!-- camión (silueta simple) -->
        <rect x="20" y="70" width="100" height="45" rx="4" fill="none" stroke="var(--box-dark)" stroke-width="2" />
        <path d="M120 85 h30 l15 15 v15 h-45 z" fill="none" stroke="var(--box-dark)" stroke-width="2" />
        <circle cx="50" cy="118" r="10" fill="var(--bg)" stroke="var(--ink)" stroke-width="2" />
        <circle cx="140" cy="118" r="10" fill="var(--bg)" stroke="var(--ink)" stroke-width="2" />

        <!-- caja abierta y vacía sobre el camión -->
        <g transform="translate(48,45)">
          <path d="M0 20 L24 8 L48 20 L24 32 Z" fill="var(--box)" stroke="var(--ink)" stroke-width="1.5" />
          <path d="M0 20 L0 34 L24 46 L24 32 Z" fill="var(--box-dark)" stroke="var(--ink)" stroke-width="1.5" />
          <path d="M48 20 L48 34 L24 46 L24 32 Z" fill="#C99A5F" stroke="var(--ink)" stroke-width="1.5" />
          <!-- solapas abiertas, caja vacía -->
          <path d="M0 20 L-10 6 L14 -2 L24 8" fill="none" stroke="var(--ink)" stroke-width="1.5"
            stroke-linecap="round" />
          <path d="M48 20 L58 6 L34 -2 L24 8" fill="none" stroke="var(--ink)" stroke-width="1.5"
            stroke-linecap="round" />
        </g>

        <!-- signo de interrogación flotando, "¿dónde está el pedido?" -->
        <text x="110" y="22" text-anchor="middle" font-size="26" fill="var(--accent)" font-family="Segoe UI, sans-serif"
          font-weight="700">?</text>
      </svg>
    </div>

    <h1>404</h1>
    <h2>Este pedido no llegó a destino</h2>
    <p>La página que buscás no existe o cambió de ruta. Nuestro camión revisó todo el trayecto y volvió con la caja
      vacía.</p>

    <a class="btn" href="/">Volver al inicio</a>
  </div>

</body>

</html>
